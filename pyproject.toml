[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-coding-assistant"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "openai",
    "anthropic",
    "google-genai",
    "pydantic",
    "python-dotenv"
]

[project.scripts]
myassistant = "coding_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = [
    "ai/instructions.md",
    "ai/workflow_instructions.md",
    "llm_data/*.json"
]