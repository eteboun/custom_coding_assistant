[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-coding-assistant"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "openai==3.17.0",
    "tiktoken>=0.14.0",
    "jsonschema",
    "pydantic",
    "python-dotenv"
]

[project.scripts]
custom-assistant = "coding_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_assistant = [
    "models.json",
    "assistant.json",
    "instructions.md"
]
